<main class="p-3">
  <app-header></app-header>
  <!-- this is string interpolation -->
  <div>
    <h1 class="text-2xl font-medium">{{ title }}</h1>
  </div>
  <!-- this is property binding -->
  <div>
    <input class="border p-2 rounded mt-2" [value]="inputValue" />
    <div class="mt-3">
      <img class="rounded border" [src]="imgUrl" alt="not found" />
    </div>
  </div>

  <router-outlet />
</main>
